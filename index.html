<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBSIDIAN</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo-box">
            <h1>OBSIDIAN</h1>
            <p>Discipline • Focus • Evolution</p>
        </div>

        <div class="profile-card">
            <h2>Tu Perfil</h2>

            <input type="text" id="name" placeholder="Tu nombre">

            <textarea id="motivation" placeholder="Tu motivación"></textarea>

            <textarea id="purpose" placeholder="¿Por qué quieres hacerlo?"></textarea>
        </div>

        <div class="goal-card">
            <h2>Metas</h2>

            <div class="goal-input">
                <input type="text" id="goalInput" placeholder="Agregar meta">
                <button onclick="addGoal()">+</button>
            </div>

            <ul id="goalList"></ul>
        </div>

    </aside>

    <!-- MAIN -->
    <main class="dashboard">

        <!-- TOP -->
        <section class="top-grid">

            <!-- GRAFICA -->
            <div class="panel graph-panel">
                <div class="panel-title">
                    <h2>Progreso Mensual</h2>
                </div>

                <canvas id="progressChart"></canvas>
            </div>

            <!-- PROGRESO -->
            <div class="panel progress-panel">

                <h2>Completado</h2>

                <div class="circle-box">
                    <div class="circle">
                        <span id="percentage">
                            0%
                        </span>
                    </div>
                </div>

                <p>Tu progreso actual</p>

            </div>

        </section>

        <!-- SEGUNDA FILA -->
        <section class="middle-grid">

            <!-- EJERCICIOS -->
            <div class="panel exercise-panel">

                <div class="panel-title">
                    <h2>Rutina Personal</h2>
                </div>

                <div class="exercise-inputs">

                    <input
                        type="text"
                        id="exerciseName"
                        placeholder="Ejercicio"
                    >

                    <input
                        type="number"
                        id="exerciseTime"
                        placeholder="Minutos"
                    >

                    <button onclick="addExercise()">
                        Agregar
                    </button>

                </div>

                <div
                    class="exercise-list"
                    id="exerciseList"
                >
                </div>

            </div>

            <!-- TEMPORIZADOR -->
            <div class="panel timer-panel">

                <div class="panel-title">
                    <h2>Modo Entrenamiento</h2>
                </div>

                <div class="timer-screen">

                    <h1 id="currentExercise">
                        Esperando rutina...
                    </h1>

                    <div id="timer">
                        00:00
                    </div>

                    <button
                        class="start-btn"
                        onclick="startWorkout()"
                    >
                        Iniciar Rutina
                    </button>

                </div>

            </div>

        </section>

        <!-- CALENDARIO -->
        <section class="panel calendar-panel">

            <div class="panel-title">
                <h2>Calendario de Progreso</h2>
            </div>

            <div
                class="calendar-grid"
                id="calendarGrid"
            >
            </div>

        </section>

        <!-- PESTAÑAS -->
        <section class="months-bar">

            <button>Enero</button>
            <button>Febrero</button>
            <button>Marzo</button>
            <button>Abril</button>
            <button>Mayo</button>
            <button>Junio</button>
            <button>Julio</button>
            <button>Agosto</button>
            <button>Septiembre</button>
            <button>Octubre</button>
            <button>Noviembre</button>
            <button>Diciembre</button>

        </section>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
